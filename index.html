<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NoxVPN</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg:        #05070f;
      --card:      rgba(10, 12, 28, 0.94);
      --glass:     rgba(12, 16, 38, 0.68);
      --accent:    #1e3a8a;
      --accent-glow:#3349b8;
      --neon:      0 0 18px rgba(30, 58, 138, 0.55), inset 0 0 12px rgba(30, 58,138, 0.25);
      --text:      #e0e7ff;
      --muted:     #a0aec0;
      --success:   #22c55e;
      --shadow:    0 12px 40px rgba(0,0,0,0.75);
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Splash ──────────────────────────────────────── */
    #splash {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.7s cubic-bezier(0.4,0,0.2,1), transform 0.7s ease;
    }
    #splash.hidden {
      opacity: 0;
      transform: scale(1.12) translateY(-20px);
      pointer-events: none;
    }
    .logo-splash {
      font-size: 6.2rem;
      font-weight: 900;
      letter-spacing: -3px;
      background: linear-gradient(135deg, #93c5fd, #1e40af, #3349b8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: var(--neon);
      animation: liquidPulse 2.4s ease-in-out infinite alternate, float 7s ease-in-out infinite;
    }
    @keyframes liquidPulse {
      0%   { filter: brightness(1) drop-shadow(0 0 20px rgba(30,58,138,0.6)); transform: scale(0.94); }
      100% { filter: brightness(1.4) drop-shadow(0 0 45px rgba(30,58,138,0.9)); transform: scale(1.06); }
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%     { transform: translateY(-18px); }
    }
    .loading-bar {
      width: 180px;
      height: 4px;
      background: rgba(30,58,138,0.18);
      border-radius: 2px;
      margin-top: 2.2rem;
      overflow: hidden;
    }
    .loading-progress {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, transparent, #3b82f6, transparent);
      animation: loading 1.6s cubic-bezier(0.4,0,0.2,1) forwards;
    }
    @keyframes loading { to { width: 100%; } }

    /* ─── Pages ───────────────────────────────────────── */
    .page {
      display: none;
      padding: 16px 18px 110px;
      min-height: 100vh;
      opacity: 0;
      transform: translateY(30px) scale(0.96);
      transition: all 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .page.active {
      display: block;
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: var(--glass);
      border-radius: 20px;
      margin-bottom: 22px;
      border: 1px solid rgba(30,58,138,0.22);
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow);
      transition: all 0.4s ease;
    }
    .header:hover { transform: translateY(-3px); }

    .logo {
      font-size: 28px;
      font-weight: 900;
      background: linear-gradient(90deg, #c7d2fe, #60a5fa, #1e40af);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -1px;
    }

    .card {
      background: var(--glass);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 20px;
      border: 1px solid rgba(30,58,138,0.25);
      backdrop-filter: blur(22px);
      box-shadow: var(--neon), var(--shadow);
      transition: all 0.45s cubic-bezier(0.34,1.56,0.64,1);
    }
    .card:hover {
      transform: translateY(-8px) scale(1.015);
      box-shadow: 0 0 40px rgba(30,58,138,0.7), var(--shadow);
    }

    .btn {
      background: linear-gradient(145deg, #1e40af, #111827);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 18px;
      font-weight: 700;
      font-size: 15.5px;
      width: 100%;
      cursor: pointer;
      transition: all 0.38s cubic-bezier(0.34,1.56,0.64,1);
      box-shadow: 0 8px 28px rgba(30,58,138,0.45);
      position: relative;
      overflow: hidden;
    }
    .btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
      transition: left 0.7s;
    }
    .btn:hover::before { left: 100%; }
    .btn:hover {
      transform: translateY(-6px) scale(1.03);
      box-shadow: 0 16px 40px rgba(30,58,138,0.65);
    }

    .tab-bar {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 94%;
      max-width: 420px;
      background: var(--glass);
      backdrop-filter: blur(32px);
      border-radius: 24px;
      display: flex;
      padding: 10px;
      border: 1px solid rgba(30,58,138,0.28);
      box-shadow: 0 -8px 32px rgba(0,0,0,0.6);
      z-index: 100;
    }
    .tab {
      flex: 1;
      color: var(--muted);
      text-align: center;
      padding: 10px 0;
      border-radius: 14px;
      transition: all 0.42s cubic-bezier(0.34,1.56,0.64,1);
    }
    .tab.active {
      color: #a5b4fc;
      background: rgba(30,58,138,0.22);
      transform: translateY(-4px);
      box-shadow: 0 6px 20px rgba(30,58,138,0.4);
    }
    .tab i { font-size: 22px; margin-bottom: 4px; transition: transform 0.4s; }
    .tab.active i { transform: scale(1.15); }

    .key-card {
      background: rgba(12,16,38,0.75);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 16px;
      border: 1px solid rgba(30,58,138,0.3);
      transition: all 0.4s ease;
    }
    .key-card:hover {
      transform: translateX(6px);
      box-shadow: 0 0 30px rgba(30,58,138,0.5);
    }

    .small-btn {
      padding: 8px 16px;
      border-radius: 12px;
      background: rgba(30,58,138,0.16);
      border: 1px solid rgba(30,58,138,0.4);
      color: #a5b4fc;
      font-size: 13.5px;
      transition: all 0.3s;
    }
    .small-btn:hover {
      background: rgba(30,58,138,0.3);
      transform: translateY(-2px);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(34,197,94,0.08);
      border-radius: 16px;
      border: 1px solid rgba(34,197,94,0.22);
      margin-top: 18px;
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>

  <!-- Splash -->
  <div id="splash">
    <div class="logo-splash">NoxVPN</div>
    <div class="loading-bar"><div class="loading-progress"></div></div>
  </div>

  <!-- Buy -->
  <div id="buy" class="page active">
    <div class="header">
      <div class="logo">NoxVPN</div>
      <button class="btn" style="width:auto;padding:12px 20px;" onclick="tg.switchInlineQueryCurrentChat('/start')">Бот</button>
    </div>

    <div class="card" style="text-align:center;">
      <div style="font-size:80px;animation:liquidPulse 5s infinite alternate;opacity:0.92;margin:20px 0;">⚡</div>
      <h2 style="margin-bottom:10px;">Premium</h2>
      <p style="color:var(--muted);">Безлимит · 5 устройств · Макс. скорость</p>

      <div style="margin:28px 0;padding:22px;background:rgba(30,58,138,0.1);border-radius:18px;border:1px solid rgba(30,58,138,0.28);">
        <div style="font-size:48px;font-weight:900;color:#a5b4fc;">100 ₽</div>
        <div style="color:var(--muted);margin-top:8px;">/ месяц — оплата в боте</div>
      </div>

      <button class="btn" onclick="tg.switchInlineQueryCurrentChat('/buy')">
        <i class="fas fa-rocket" style="margin-right:10px;"></i> КУПИТЬ В БОТЕ
      </button>
    </div>
  </div>

  <!-- Keys -->
  <div id="keys" class="page">
    <div class="header">
      <button onclick="showPage('buy')">←</button>
      <div class="logo">Конфиги</div>
      <button onclick="loadKeys()"><i class="fas fa-sync"></i></button>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h3>Ключи</h3>
        <span id="count" style="background:rgba(34,197,94,0.1);color:var(--success);padding:6px 14px;border-radius:20px;font-size:14px;">0</span>
      </div>
      <div id="keyList"></div>
    </div>
  </div>

  <!-- Profile & Info pages (можно расширить) -->

  <div class="tab-bar">
    <div class="tab active"  onclick="showPage('buy',this)"><i class="fas fa-bolt"></i><div>Купить</div></div>
    <div class="tab" onclick="showPage('keys',this);loadKeys()"><i class="fas fa-key"></i><div>Ключи</div></div>
    <div class="tab" onclick="showPage('profile',this)"><i class="fas fa-user"></i><div>Профиль</div></div>
    <div class="tab" onclick="showPage('info',this)"><i class="fas fa-info-circle"></i><div>Инструкция</div></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready(); tg.expand(); tg.setBackgroundColor('#05070f'); tg.setHeaderColor('#05070f');

    const USERS_URL = 'https://raw.githubusercontent.com/wholovelyflick/N0xVpn/refs/heads/main/sub.txt?token=GHSAT0AAAAAADTUP5BYBGDSGRXP23JNV3YE2LR6R5Q?t=';

    let userId = tg.initDataUnsafe?.user?.id?.toString() || 'test';
    let configs = [];

    // Быстрый splash (~1.6–1.8 сек)
    setTimeout(() => {
      document.getElementById('splash').classList.add('hidden');
    }, 1600);

    async function fetchText(url) {
      try {
        const res = await fetch(url + Date.now());
        return res.ok ? await res.text() : '';
      } catch { return ''; }
    }

    async function loadKeys() {
      const list = document.getElementById('keyList');
      list.innerHTML = '<div style="text-align:center;padding:70px 0;color:var(--muted);"><div style="width:36px;height:36px;border:4px solid rgba(30,58,138,0.25);border-top:4px solid #3b82f6;border-radius:50%;animation:spin 0.9s linear infinite;margin:0 auto 16px;"></div>Загрузка...</div>';

      const text = await fetchText(USERS_URL);
      if (!text) return list.innerHTML = '<div style="text-align:center;padding:70px 0;color:#fca5a5;">Ошибка загрузки</div>';

      for (const line of text.split('\n')) {
        if (line.startsWith(userId + ':')) {
          configs = line.split(':').slice(1).join(':').split('|').map(c => c.trim()).filter(c => c.startsWith('vless://'));
          break;
        }
      }

      if (!configs.length) {
        list.innerHTML = '<div style="text-align:center;padding:70px 0;color:var(--muted);">Нет конфигов<br><button class="btn" style="margin-top:24px;" onclick="tg.switchInlineQueryCurrentChat(\'/buy\')">Купить подписку</button></div>';
        document.getElementById('count').textContent = '0';
        return;
      }

      list.innerHTML = '';
      configs.forEach((cfg, i) => {
        const el = document.createElement('div');
        el.className = 'key-card';
        el.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <div style="font-weight:600;">Сервер ${i+1}</div>
            <span style="color:var(--success);font-size:14px;">активен</span>
          </div>
          <div style="color:var(--muted);font-size:13.5px;word-break:break-all;opacity:0.9;margin-bottom:14px;">
            ${cfg.slice(0,72)}${cfg.length>72?'...':''}
          </div>
          <div style="display:flex;gap:12px;">
            <button class="small-btn" onclick="location='v2raytun://import/${encodeURIComponent(cfg)}'">Подключить</button>
            <button class="small-btn" onclick="navigator.clipboard.writeText('${cfg}').then(()=>tg.showPopup({message:'Скопировано'}))">Копировать</button>
          </div>`;
        list.appendChild(el);
      });

      document.getElementById('count').textContent = configs.length;
    }

    function showPage(id, el) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      setTimeout(() => document.getElementById(id).classList.add('active'), 80);

      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      if (el) el.classList.add('active');
    }

    // Init
    loadKeys();
  </script>
</body>
</html>
